server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── Сжатие ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 512;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── API proxy ──────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Connection        "";
        proxy_read_timeout    120s;
        proxy_connect_timeout  10s;
        proxy_intercept_errors off;

        # Не кэшировать API-ответы в nginx
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /api {
        proxy_pass http://backend:8000/api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── Vite-сборка: content-hash в имени → кэш навсегда ─────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
    }

    # ── Статика (CSS/JS/картинки) — кэш 1 час с revalidation ─────────────────
    # Это ключевое изменение: было "no-store" (запрос каждый раз),
    # стало ETag + 1h → браузер перепроверяет раз в час, но не грузит заново
    location /static/ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        add_header Vary Accept-Encoding;
        etag on;
    }

    # ── Статичные картинки — кэш 7 дней ──────────────────────────────────────
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
    }

    # ── Шрифты — кэш 1 год ────────────────────────────────────────────────────
    location ~* \.(woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # ── SPA fallback ───────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # index.html не кэшируем — браузер всегда должен получить свежую версию
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }
}
